{% extends 'base.html' %}

{% block title %}Blog{% endblock %}

{% block content %}
    <h1>Blog</h1>

    <div class="container">
        <div class="row">
            {% for post in posts %}
                <div class="col-md-4">
                    <div class="card mb-4">
                        <img src="{{ url_for('static', filename='post_images/' + post.image_file) }}" class="card-img-top" alt="Imagen del post">
                        <div class="card-body">
                            <h5 class="card-title">{{ post.title }}</h5>
                            <p class="card-text">{{ post.content[:150] }}...</p>  <!-- Muestra solo los primeros 150 caracteres -->
                            <p class="card-text"><small class="text-muted">{{ post.date_posted.strftime('%d/%m/%Y') }}</small></p>

                            <!-- Botón Leer más -->
                            <a href="{{ url_for('post_detail', post_id=post.id) }}" class="btn btn-primary">Leer más</a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
