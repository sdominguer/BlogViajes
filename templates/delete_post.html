{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Eliminar Post</h2>

    <p>¿Estás seguro de que deseas eliminar el post "{{ post.title }}"?</p>
    <form method="POST">
        {{ form.hidden_tag() }}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
