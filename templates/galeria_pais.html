{% extends 'base.html' %}

{% block content %}
<section class="py-5">
    <div class="container">
        <h2 class="mb-4 text-center">Galería de {{ pais | capitalize }}</h2>
        <div class="row g-4">
            {% for img in imagenes %}
            <div class="col-6 col-md-4 col-lg-3">
                <div class="gallery-item">
                    <img src="{{ url_for('static', filename=img) }}" class="img-fluid rounded shadow-sm" alt="{{ pais }}">
                </div>
            </div>
            {% endfor %}
        </div>
        <div class="text-center mt-5">
            <a href="{{ url_for('index') }}" class="btn btn-secondary">← Volver al inicio</a>
        </div>
    </div>
</section>
{% endblock %}
